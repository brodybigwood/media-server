<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Server</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <div class="auth-box">
            <label for="api-key">API KEY: </label>
            <input type="password" id="api-key" placeholder="Enter API Key">
        </div>
        <h1>My Media</h1>
    </header>

    <main id="media-browser-container"></main>

    <div id="custom-scrollbar">
        <div id="scroll-handle"></div>
    </div>
    <div id="scroll-indicator"></div>

    <!-- Full-screen Media Viewer -->
    <div id="media-viewer" class="hidden">
        <button id="close-viewer" class="control-btn">✕</button>
        
        <div id="viewer-content">
            <div id="viewer-slider">
                <div class="viewer-slide" id="slide-prev"></div>
                <div class="viewer-slide" id="slide-curr"></div>
                <div class="viewer-slide" id="slide-next"></div>
            </div>
            <!-- Overlay to catch swipes over videos -->
            <div id="swipe-overlay"></div>
        </div>

        <div id="viewer-ui-overlay">
            <div id="media-info" class="side-controls">
                <button id="download-btn" class="control-btn">↓</button>
            </div>
            <div id="viewer-date"></div>

            <div id="viewer-video-ui">
                <div id="pause-icon" class="hidden">II</div>
                <div id="ruler-wrapper" class="hidden">
                    <div id="ruler-playhead"></div>
                    <div id="ruler-container">
                        <div id="ruler-strip"></div>
                    </div>
                    <div id="ruler-time-hud">
                        <span id="ruler-current">0:00</span> / <span id="ruler-total">0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
